# Experiment-only FDAS overrides. Production defaults remain unchanged.
dependent_atomspace:
  enabled: true
  shadow_enabled: true
  authority_enabled: false
  schema_version: "1.1"
  store_backend: "memory"
  revision_retention: 4

  materialization:
    maximum_atoms_global: 250000
    maximum_atoms_per_city_scope: 5000
    maximum_atoms_per_unit_scope: 2000
    maximum_atoms_per_region_scope: 30000
    maximum_rule_fires_per_scope: 250000
    maximum_groundings_per_scope: 250000
    maximum_expansion_depth: 128

  inference:
    generic_rule_engine_enabled: false
    technology_compatibility_path_enabled: true
    deterministic_forward_enabled: true
    goal_regression_enabled: true
    uncertain_assessment_enabled: false

  domain_authority:
    city_stability: false
    city_production: false
    city_defense: false
    local_movement: false
    expansion: false
    combat: false
    transport: false
    research: false

  events:
    support_level: "aggregate"
    explanation_capture: true
    shadow_divergence_capture: true
