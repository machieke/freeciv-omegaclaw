<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">G2 predicted versus realized relief contract fixture</title>
  <desc id="desc">Eight claim-ineligible contract points split by operation category and short or medium horizon.</desc>
  <rect width="900" height="560" fill="#fbfbfc"/>
  <text x="450" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#20242b">G2 predicted vs realized relief</text>
  <text x="450" y="57" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a13d3d">Contract fixture — not empirical gameplay calibration</text>
  <line x1="95" y1="470" x2="825" y2="470" stroke="#343a40" stroke-width="2"/>
  <line x1="95" y1="470" x2="95" y2="90" stroke="#343a40" stroke-width="2"/>
  <line x1="95" y1="470" x2="825" y2="90" stroke="#aab1b8" stroke-width="2" stroke-dasharray="7 6"/>
  <g font-family="sans-serif" font-size="11" fill="#4c535b">
    <text x="95" y="490" text-anchor="middle">0.0</text>
    <text x="241" y="490" text-anchor="middle">0.2</text>
    <text x="387" y="490" text-anchor="middle">0.4</text>
    <text x="533" y="490" text-anchor="middle">0.6</text>
    <text x="679" y="490" text-anchor="middle">0.8</text>
    <text x="825" y="490" text-anchor="middle">1.0</text>
    <text x="77" y="474" text-anchor="end">0.0</text>
    <text x="77" y="398" text-anchor="end">0.2</text>
    <text x="77" y="322" text-anchor="end">0.4</text>
    <text x="77" y="246" text-anchor="end">0.6</text>
    <text x="77" y="170" text-anchor="end">0.8</text>
    <text x="77" y="94" text-anchor="end">1.0</text>
    <text x="460" y="525" text-anchor="middle" font-size="14">Predicted relief</text>
    <text x="24" y="280" text-anchor="middle" font-size="14" transform="rotate(-90 24 280)">Realized relief</text>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="533" cy="280" r="8" fill="#3b82f6"><title>city_defense medium: predicted 0.60, realized 0.50</title></circle>
    <circle cx="642.5" cy="185" r="8" fill="#3b82f6"><title>city_defense short: predicted 0.75, realized 0.75</title></circle>
    <circle cx="606" cy="280" r="8" fill="#10b981"><title>city_founding medium: predicted 0.70, realized 0.50</title></circle>
    <circle cx="679" cy="90" r="8" fill="#10b981"><title>city_founding short: predicted 0.80, realized 1.00</title></circle>
    <circle cx="423.5" cy="375" r="8" fill="#f59e0b"><title>exploration_move medium: predicted 0.45, realized 0.25</title></circle>
    <circle cx="314" cy="470" r="8" fill="#f59e0b"><title>exploration_move short: predicted 0.30, realized 0.00</title></circle>
    <circle cx="496.5" cy="470" r="8" fill="#8b5cf6"><title>production_economy medium: predicted 0.55, realized 0.00</title></circle>
    <circle cx="387" cy="375" r="8" fill="#8b5cf6"><title>production_economy short: predicted 0.40, realized 0.25</title></circle>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#30363d">
    <circle cx="165" cy="535" r="6" fill="#3b82f6"/><text x="177" y="539">city defense</text>
    <circle cx="310" cy="535" r="6" fill="#10b981"/><text x="322" y="539">city founding</text>
    <circle cx="465" cy="535" r="6" fill="#f59e0b"/><text x="477" y="539">exploration</text>
    <circle cx="600" cy="535" r="6" fill="#8b5cf6"/><text x="612" y="539">production economy</text>
  </g>
</svg>
